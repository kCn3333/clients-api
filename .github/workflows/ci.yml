# .github/workflows/ci.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: kcn333/clients-api
  CHART_REGISTRY: ghcr.io/kcn3333/charts
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 24
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test -q

  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Generate image metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-chart:
    name: Publish Helm Chart to GHCR
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')  # ← only for tags, no main

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update chart version and appVersion
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION }}/" helm/clients-api/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.VERSION }}\"/" helm/clients-api/Chart.yaml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Package and push chart
        run: |
          helm package helm/clients-api
          helm push clients-api-${{ steps.version.outputs.VERSION }}.tgz oci://${{ env.CHART_REGISTRY }}

      - name: Verify chart was pushed
        run: |
          helm show chart oci://${{ env.CHART_REGISTRY }}/clients-api \
            --version ${{ steps.version.outputs.VERSION }}
            
  deploy-to-aws:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      id-token: write   # required for OIDC
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check ECS service status
        id: check_ecs
        run: |
          STATUS=$(aws ecs describe-services \
            --cluster aws-devops-dev-cluster \
            --services aws-devops-dev-service \
            --region eu-north-1 \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "NOTFOUND")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "ECS Service Status: $STATUS"

      - name: Skip — infrastructure not running
        if: steps.check_ecs.outputs.status != 'ACTIVE'
        run: |
          echo "ECS service status: ${{ steps.check_ecs.outputs.status }}"
          echo "Infrastructure is not running — skipping deployment."
          echo "Run 'terraform apply' in aws-devops repo to provision infrastructure."

      - name: Deploy to ECS (rolling update)
        if: steps.check_ecs.outputs.status == 'ACTIVE'
        run: |
          echo "Triggering rolling deployment..."
          aws ecs update-service \
            --cluster aws-devops-dev-cluster \
            --service aws-devops-dev-service \
            --force-new-deployment \
            --region eu-north-1 \
            --output json | jq '.service | {status, desiredCount, runningCount, pendingCount}'

      - name: Wait for deployment to stabilize
        if: steps.check_ecs.outputs.status == 'ACTIVE'
        run: |
          echo "Waiting for all tasks to be healthy (timeout: 10 min)..."
          aws ecs wait services-stable \
            --cluster aws-devops-dev-cluster \
            --services aws-devops-dev-service \
            --region eu-north-1
          echo "Deployment complete!"

      - name: Verify deployment
        if: steps.check_ecs.outputs.status == 'ACTIVE'
        run: |
          aws ecs describe-services \
            --cluster aws-devops-dev-cluster \
            --services aws-devops-dev-service \
            --region eu-north-1 \
            --query 'services[0].{status:status, running:runningCount, desired:desiredCount, deployment:deployments[0].rolloutState}'  
